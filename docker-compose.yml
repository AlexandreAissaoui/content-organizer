services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Le "relaxed binding" de Spring lie ces variables aux propriétés
      # spring.datasource.* et app.jwt.secret-key. La base est joignable
      # via le nom du service Docker "db", et non localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_SQL_INIT_MODE: always
      # Secret JWT : à fournir via un fichier .env (gitignoré) ou la variable
      # d'environnement de la machine hôte. Ne jamais committer de secret.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
