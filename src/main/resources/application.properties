spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=admin
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# AuditRevisionEntity maps allocationSize=1 while the sequence was created with
# INCREMENT BY 50. Without a strategy, Hibernate throws a MappingException at
# startup (default EXCEPTION). FIX keeps the mismatch from failing the boot; the
# revision ids come straight from nextval (NoopOptimizer), so the DB increment
# itself has no effect on the generated numbers.
spring.jpa.properties.hibernate.id.sequence.increment_size_mismatch_strategy=FIX
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true 
spring.profiles.active=dev


app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.expiration=86400000

